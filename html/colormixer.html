<html><head>
      <meta charset="UTF-8">
      <title>9-bit RGB Color Space</title>
      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          padding: 30px;
          background: #181818;
          color: white;
          font-family: system-ui, sans-serif;
        }

        #rgb-inputs {
          display: flex;
          flex-wrap: wrap;
          gap: 24px;
        }

        .rgb-channel {
          width: 180px;
        }

        .rgb-channel svg {
          display: block;
          width: 100%;
          height: auto;
        }

        #rgb-output svg {
          display: block;
          width: 300px;
          max-width: 100%;
          height: auto;
          margin-top: 15px;
        }

        .rgb-switch {
          cursor: pointer;
          fill: transparent;
          stroke: #888;
          stroke-width: 2;
        }

        .rgb-switch:hover {
          stroke: white;
          stroke-width: 5;
        }

        .rgb-state {
          display: none;
        }

        .rgb-state.active {
          display: inline;
        }

        #rgb-readout {
          margin-top: 16px;
          font-family: monospace;
          font-size: 18px;
        }
      </style>
    </head>
